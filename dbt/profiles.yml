# Connexion pilotée entièrement par variables d'environnement (même logique que le provider
# Terraform Snowflake et apps/pipeline/load_cloud.py) — jamais de credentials en dur ici.
# SNOWFLAKE_PRIVATE_KEY_PATH : chemin vers le fichier PEM (pas la clé en base64/texte directement
# — cf. cloud/airflow/dags/pipeline_dag.py qui décode SNOWFLAKE_PRIVATE_KEY_B64 dans ce fichier
# avant d'appeler dbt).
euromobilitydatahub:
  target: prod
  outputs:
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ORGANIZATION_NAME') }}-{{ env_var('SNOWFLAKE_ACCOUNT_NAME') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      schema: MART
      threads: 2
