services:
  dev:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - APP_ENV=dev
    volumes:
      - ./data:/app/data
      - ./environments:/app/environments
      - ./config:/app/config
      - ./tarifs:/app/tarifs
      - ./outputs:/app/outputs

  preprod:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - APP_ENV=preprod
    volumes:
      - ./data:/app/data
      - ./environments:/app/environments
      - ./config:/app/config
      - ./tarifs:/app/tarifs
      - ./outputs:/app/outputs

  prod:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - APP_ENV=prod
    volumes:
      - ./data:/app/data
      - ./environments:/app/environments
      - ./config:/app/config
      - ./tarifs:/app/tarifs
      - ./outputs:/app/outputs

  api:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - APP_ENV=${API_ENV:-preprod}
    entrypoint: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./environments:/app/environments
