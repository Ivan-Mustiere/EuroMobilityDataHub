services:
  preprod:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - APP_ENV=preprod
    volumes:
      - ./data:/app/data
      - ./environments:/app/environments
      - ./config:/app/config
      - ./outputs:/app/outputs

  prod:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - APP_ENV=prod
    volumes:
      - ./data:/app/data
      - ./environments:/app/environments
      - ./config:/app/config
      - ./outputs:/app/outputs

  api:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - APP_ENV=${API_ENV:-preprod}
      - API_KEYS=${API_KEYS:-dev-local-key}
    entrypoint: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8000:8000"
    # Credentials Snowflake (SVC_API, rôle ANALYST — lecture seule MART) : l'API lit Snowflake
    # directement, plus de fichier DuckDB local (cf. infra/cloud/docker-compose.yml pour le
    # même service côté stack AWS, qui utilise le même secret via Secrets Manager).
    env_file:
      - infra/cloud/local-test/svc_api.env

  # Chiffrement en transit (C1.4.2) : TLS terminé par Caddy (CA interne, pas de domaine requis
  # pour la démo). Accès : https://localhost:8443 (le navigateur avertit sur le certificat local,
  # c'est attendu — voir ops/caddy/Caddyfile).
  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
    ports:
      - "8443:8443"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3030:3000"
    depends_on:
      - prometheus

  # Dashboard métier (C2.1.3) — équivalent open source de Power BI
  # Prérequis : bash ops/monitoring/metabase/download_driver.sh
  metabase:
    build:
      context: ./ops/monitoring/metabase
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - ./environments:/environments
      - metabase-data:/metabase-data

volumes:
  metabase-data:
  caddy-data:
