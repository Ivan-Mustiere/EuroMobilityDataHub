services:
  dev:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - APP_ENV=dev
    volumes:
      - ./data:/app/data
      - ./environments:/app/environments
      - ./config:/app/config
      - ./outputs:/app/outputs

  preprod:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - APP_ENV=preprod
    volumes:
      - ./data:/app/data
      - ./environments:/app/environments
      - ./config:/app/config
      - ./outputs:/app/outputs

  prod:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - APP_ENV=prod
    volumes:
      - ./data:/app/data
      - ./environments:/app/environments
      - ./config:/app/config
      - ./outputs:/app/outputs

  api:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - APP_ENV=${API_ENV:-preprod}
    entrypoint: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8000:8000"
    volumes:
      - ./environments:/app/environments

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
