# Stack déployée sur l'EC2 Applicative (cf. infra/terraform/ec2.tf) — distincte du
# docker-compose.yml racine (dev/preprod/prod local). CLUSTER_ID : identifiant KRaft fixe pour un
# cluster Kafka mono-nœud jetable (pas un secret, juste un UUID formaté pour Kafka).
services:
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

  kafka-init-topic:
    image: apache/kafka:3.8.0
    depends_on:
      - kafka
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list; do sleep 2; done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic gtfs-rt-trip-updates --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic gtfs-rt-trip-updates-ch --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic gtfs-rt-trip-updates-nl --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic gtfs-rt-trip-updates-it --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic gtfs-rt-trip-updates-fi --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic gtfs-rt-trip-updates-pl --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic gtfs-rt-trip-updates-de --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic gtfs-rt-trip-updates-se --partitions 1 --replication-factor 1

  producer:
    build: ../../apps/streaming
    command: ["python", "producer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: gtfs-rt-trip-updates

  consumer:
    build: ../../apps/streaming
    command: ["python", "consumer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: gtfs-rt-trip-updates
    # ${RDS_ENV_FILE} : positionné par le bootstrap EC2 vers le secret réel (cf. ec2.tf) ; par
    # défaut, pointe vers les valeurs factices du profil local-test.
    env_file:
      - ${RDS_ENV_FILE:-./local-test/rds.env}

  # Suisse (opentransportdata.swiss) : même image que producer/consumer, généralisée par variables
  # d'env (cf. apps/streaming/producer.py) plutôt que dupliquée. Écrit dans la même table
  # fact_realtime (colonne `pays`), consommée par la même API — cf. plan Suisse.
  producer_ch:
    build: ../../apps/streaming
    command: ["python", "producer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    env_file:
      - ${CH_ENV_FILE:-./local-test/ch.env}
    volumes:
      # ch_rail_routes.txt (route_id ferroviaires suisses) généré par apps/pipeline/transform.py,
      # build_ch_reference — cf. RAIL_ROUTES_FILE dans ch.env.
      - ../../data/raw:/app/data/raw:ro

  consumer_ch:
    build: ../../apps/streaming
    command: ["python", "consumer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: gtfs-rt-trip-updates-ch
    env_file:
      - ${RDS_ENV_FILE:-./local-test/rds.env}

  # Pays-Bas (OVapi/ND-OV) : flux public sans authentification, déjà dédié aux trains (pas de
  # RAIL_ROUTES_FILE nécessaire, contrairement à la Suisse) et publiant déjà une heure absolue par
  # arrêt (pas la seule limite suisse) — cf. plan Suisse, section Pays-Bas.
  producer_nl:
    build: ../../apps/streaming
    command: ["python", "producer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    env_file:
      - ${NL_ENV_FILE:-./local-test/nl.env}

  consumer_nl:
    build: ../../apps/streaming
    command: ["python", "consumer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: gtfs-rt-trip-updates-nl
    env_file:
      - ${RDS_ENV_FILE:-./local-test/rds.env}

  # Italie (Trenitalia France) : même proxy public que la SNCF (transport.data.gouv.fr), sans
  # authentification — ne couvre que les trains transfrontaliers Paris/Lyon-Milan (~38 trains),
  # pas le réseau italien domestique (aucun flux GTFS-RT national italien ouvert trouvé).
  producer_it:
    build: ../../apps/streaming
    command: ["python", "producer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    env_file:
      - ${IT_ENV_FILE:-./local-test/it.env}

  consumer_it:
    build: ../../apps/streaming
    command: ["python", "consumer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: gtfs-rt-trip-updates-it
    env_file:
      - ${RDS_ENV_FILE:-./local-test/rds.env}

  # Finlande (Digitraffic/VR) : API JSON propriétaire (pas GTFS-RT, cf. apps/streaming/
  # producer_fi.py), publique sans authentification. Position/retard seulement pour l'instant
  # (pas de cause : les codes de cause demandent une table de correspondance à part).
  producer_fi:
    build: ../../apps/streaming
    command: ["python", "producer_fi.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    env_file:
      - ${FI_ENV_FILE:-./local-test/fi.env}

  consumer_fi:
    build: ../../apps/streaming
    command: ["python", "consumer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: gtfs-rt-trip-updates-fi
    env_file:
      - ${RDS_ENV_FILE:-./local-test/rds.env}

  # Pologne (republication communautaire mkuran.pl des données officielles PKP/PLK) : flux public
  # sans authentification, mais qui ne référence les arrêts que par stop_sequence — résolu via
  # STOP_SEQUENCE_MAP_FILE (pl_stop_sequence_map.csv, généré par apps/pipeline/transform.py,
  # build_pl_reference), d'où le montage du volume data/raw.
  producer_pl:
    build: ../../apps/streaming
    command: ["python", "producer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    env_file:
      - ${PL_ENV_FILE:-./local-test/pl.env}
    volumes:
      - ../../data/raw:/app/data/raw:ro

  consumer_pl:
    build: ../../apps/streaming
    command: ["python", "consumer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: gtfs-rt-trip-updates-pl
    env_file:
      - ${RDS_ENV_FILE:-./local-test/rds.env}

  # Allemagne (DELFI, agrégat national gtfs.de) : flux public sans authentification, mais mélange
  # tous les modes de transport et ne publie jamais de route_id — filtré via RAIL_TRIPS_FILE
  # (de_rail_trips.txt, généré par apps/pipeline/transform.py, build_de_reference).
  producer_de:
    build: ../../apps/streaming
    command: ["python", "producer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    env_file:
      - ${DE_ENV_FILE:-./local-test/de.env}
    volumes:
      - ../../data/raw:/app/data/raw:ro

  consumer_de:
    build: ../../apps/streaming
    command: ["python", "consumer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: gtfs-rt-trip-updates-de
    env_file:
      - ${RDS_ENV_FILE:-./local-test/rds.env}

  # Suède (Trafiklab/Samtrafiken, opérateur Skånetrafiken — cf. se.env) : flux mélangeant tous les
  # modes et ne publiant quasiment jamais de route_id, filtré via RAIL_TRIPS_FILE
  # (se_rail_trips.txt, généré par apps/pipeline/transform.py, build_se_reference) — même principe
  # que l'Allemagne, d'où le montage du volume data/raw.
  producer_se:
    build: ../../apps/streaming
    command: ["python", "producer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    env_file:
      - ${SE_ENV_FILE:-./local-test/se.env}
    volumes:
      - ../../data/raw:/app/data/raw:ro

  consumer_se:
    build: ../../apps/streaming
    command: ["python", "consumer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: gtfs-rt-trip-updates-se
    env_file:
      - ${RDS_ENV_FILE:-./local-test/rds.env}

  # Postgres jetable pour tester tout le flux Kafka -> Postgres en local, sans RDS réel :
  #   docker compose --profile local-test up
  postgres-test:
    image: postgis/postgis:16-3.5 # RDS supporte nativement CREATE EXTENSION postgis ; l'image
    # postgres officielle non, d'où cette image dédiée pour le test local uniquement.
    profiles: ["local-test"]
    environment:
      POSTGRES_DB: euromobilitydatahub
      POSTGRES_USER: etl_admin
      POSTGRES_PASSWORD: localtest
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Cible du NLB de la DMZ (cf. infra/terraform/dmz.tf) : seul point d'accès réel à l'API depuis
  # ce jour, le port 8000 n'étant plus ouvert au public sur cette instance (vpc.tf).
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    restart: unless-stopped
    environment:
      # DAG Airflow (pipeline_dag.py) écrit toujours dans l'environnement preprod : l'API doit
      # lire la même base pour servir des données réelles, quel que soit l'environnement AWS
      # (preprod ou prod) sur lequel cette stack tourne.
      APP_ENV: preprod
    ports:
      - "8000:8000"
    volumes:
      - ../../environments:/app/environments
    # ${API_ENV_FILE} : idem RDS_ENV_FILE/SNOWFLAKE_ENV_FILE, positionné par le bootstrap EC2.
    # RDS_ENV_FILE (même variable que le service `consumer`) : l'endpoint /realtime/trains lit la
    # même base Postgres que le consumer y écrit.
    # SVC_API_ENV_FILE : credentials Snowflake (SVC_API, rôle ANALYST) — l'API lit les tables
    # Gold (MART) directement plutôt qu'un fichier DuckDB local, cf. secrets.tf.
    env_file:
      - ${API_ENV_FILE:-./local-test/api.env}
      - ${RDS_ENV_FILE:-./local-test/rds.env}
      - ${SVC_API_ENV_FILE:-./local-test/svc_api.env}

  airflow:
    # Image personnalisée (cf. ./airflow/Dockerfile) : PySpark (Bloc 1, partie 4.1) a besoin d'une
    # JVM, absente de l'image officielle et impossible à ajouter via _PIP_ADDITIONAL_REQUIREMENTS
    # (ne gère que des paquets Python, pas de paquets système).
    build: ./airflow
    command: ["standalone"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      # Alerte email sur échec de tâche (Bloc 1, partie 5.2/d) via AWS SES, cf. pipeline_dag.py.
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      # Le mode "standalone" lance plusieurs workers gunicorn pour le webserver : sans clé fixe,
      # chaque worker génère la sienne au démarrage, et la session/CSRF créée par l'un peut être
      # rejetée par un autre — connexion "Invalid login" intermittente malgré des identifiants
      # corrects (bug constaté en prod). Valeur non sensible (protège juste les sessions
      # Airflow elles-mêmes, pas un secret métier) : committée directement, comme CLUSTER_ID
      # ci-dessus pour Kafka.
      AIRFLOW__WEBSERVER__SECRET_KEY: f58d4af2c08482aee90679e85865754050acdeda66b2bd873b7dce77400d
    # ${SNOWFLAKE_ENV_FILE} : idem RDS_ENV_FILE, positionné par le bootstrap EC2 en production.
    # ${SE_STATIC_ENV_FILE} : SE_GTFS_STATIC_KEY, lu par apps/pipeline/ingest.py (référentiel
    # suédois, cf. se_static.env) — exécuté ici via le DAG (pipeline_dag.py, tâche `ingest`).
    env_file:
      - ${SNOWFLAKE_ENV_FILE:-./local-test/snowflake.env}
      - ${SE_STATIC_ENV_FILE:-./local-test/se_static.env}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      # Miroir exact de la disposition du dépôt sous /opt/app (apps/pipeline/, data/, config/...
      # en frères) : ROOT = pathlib.Path(__file__).resolve().parent.parent.parent dans
      # ingest.py/transform.py/load_cloud.py suppose cette profondeur précise, qu'il tourne en
      # local (repo réel) ou ici (conteneur) — un montage aplati ("pipeline/" au lieu
      # d'"apps/pipeline/") casserait ce calcul.
      - ../../apps:/opt/app/apps
      - ../../data:/opt/app/data
      - ../../config:/opt/app/config
      - ../../environments:/opt/app/environments
      - ../../dbt:/opt/app/dbt
      - airflow-data:/opt/airflow

  # Supervision réelle de la pipeline cloud (Bloc 1, partie 2.4/5.2.d) : scrape l'API (déjà
  # instrumentée, cf. apps/api/main.py) directement sur l'EC2 Applicative. Ports mappés sur
  # l'hôte mais AUCUNE règle entrante côté security group (vpc.tf) : accès admin exclusivement
  # via tunnel SSM (aws ssm start-session --document-name AWS-StartPortForwardingSession), qui ne
  # transite pas par le SG — cohérent avec le principe "zéro port entrant sauf SSM" de cette
  # instance.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  airflow-data:
