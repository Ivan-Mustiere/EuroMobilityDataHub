# Stack déployée sur l'EC2 Applicative (cf. infra/terraform/ec2.tf) — distincte du
# docker-compose.yml racine (dev/preprod/prod local). CLUSTER_ID : identifiant KRaft fixe pour un
# cluster Kafka mono-nœud jetable (pas un secret, juste un UUID formaté pour Kafka).
services:
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

  kafka-init-topic:
    image: apache/kafka:3.8.0
    depends_on:
      - kafka
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list; do sleep 2; done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic gtfs-rt-trip-updates --partitions 1 --replication-factor 1

  producer:
    build: ../../apps/streaming
    command: ["python", "producer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: gtfs-rt-trip-updates

  consumer:
    build: ../../apps/streaming
    command: ["python", "consumer.py"]
    restart: unless-stopped
    depends_on:
      - kafka-init-topic
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: gtfs-rt-trip-updates
    # ${RDS_ENV_FILE} : positionné par le bootstrap EC2 vers le secret réel (cf. ec2.tf) ; par
    # défaut, pointe vers les valeurs factices du profil local-test.
    env_file:
      - ${RDS_ENV_FILE:-./local-test/rds.env}

  # Postgres jetable pour tester tout le flux Kafka -> Postgres en local, sans RDS réel :
  #   docker compose --profile local-test up
  postgres-test:
    image: postgis/postgis:16-3.5 # RDS supporte nativement CREATE EXTENSION postgis ; l'image
    # postgres officielle non, d'où cette image dédiée pour le test local uniquement.
    profiles: ["local-test"]
    environment:
      POSTGRES_DB: euromobilitydatahub
      POSTGRES_USER: etl_admin
      POSTGRES_PASSWORD: localtest
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Cible du NLB de la DMZ (cf. infra/terraform/dmz.tf) : seul point d'accès réel à l'API depuis
  # ce jour, le port 8000 n'étant plus ouvert au public sur cette instance (vpc.tf).
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    restart: unless-stopped
    environment:
      # DAG Airflow (pipeline_dag.py) écrit toujours dans l'environnement preprod : l'API doit
      # lire la même base pour servir des données réelles, quel que soit l'environnement AWS
      # (preprod ou prod) sur lequel cette stack tourne.
      APP_ENV: preprod
    ports:
      - "8000:8000"
    volumes:
      - ../../environments:/app/environments
    # ${API_ENV_FILE} : idem RDS_ENV_FILE/SNOWFLAKE_ENV_FILE, positionné par le bootstrap EC2.
    # RDS_ENV_FILE (même variable que le service `consumer`) : l'endpoint /realtime/trains lit la
    # même base Postgres que le consumer y écrit.
    env_file:
      - ${API_ENV_FILE:-./local-test/api.env}
      - ${RDS_ENV_FILE:-./local-test/rds.env}

  airflow:
    # Image personnalisée (cf. ./airflow/Dockerfile) : PySpark (Bloc 1, partie 4.1) a besoin d'une
    # JVM, absente de l'image officielle et impossible à ajouter via _PIP_ADDITIONAL_REQUIREMENTS
    # (ne gère que des paquets Python, pas de paquets système).
    build: ./airflow
    command: ["standalone"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      # Alerte email sur échec de tâche (Bloc 1, partie 5.2/d) via AWS SES, cf. pipeline_dag.py.
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      AWS_REGION: ${AWS_REGION:-eu-west-3}
    # ${SNOWFLAKE_ENV_FILE} : idem RDS_ENV_FILE, positionné par le bootstrap EC2 en production.
    env_file:
      - ${SNOWFLAKE_ENV_FILE:-./local-test/snowflake.env}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      # Miroir exact de la disposition du dépôt sous /opt/app (apps/pipeline/, data/, config/...
      # en frères) : ROOT = pathlib.Path(__file__).resolve().parent.parent.parent dans
      # ingest.py/transform.py/load_cloud.py suppose cette profondeur précise, qu'il tourne en
      # local (repo réel) ou ici (conteneur) — un montage aplati ("pipeline/" au lieu
      # d'"apps/pipeline/") casserait ce calcul.
      - ../../apps:/opt/app/apps
      - ../../data:/opt/app/data
      - ../../config:/opt/app/config
      - ../../environments:/opt/app/environments
      - ../../dbt:/opt/app/dbt
      - airflow-data:/opt/airflow

  # Supervision réelle de la pipeline cloud (Bloc 1, partie 2.4/5.2.d) : scrape l'API (déjà
  # instrumentée, cf. apps/api/main.py) directement sur l'EC2 Applicative. Ports mappés sur
  # l'hôte mais AUCUNE règle entrante côté security group (vpc.tf) : accès admin exclusivement
  # via tunnel SSM (aws ssm start-session --document-name AWS-StartPortForwardingSession), qui ne
  # transite pas par le SG — cohérent avec le principe "zéro port entrant sauf SSM" de cette
  # instance.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  airflow-data:
