name: Preprod pipeline

on:
  workflow_dispatch:
  # Automatisation planifiée (C1.1.3) : la donnée source SNCF (ponctualité mensuelle) n'a pas
  # besoin d'un rafraîchissement quotidien — un cron hebdomadaire garantit l'actualisation sans
  # surcharger la source, cohérent avec la cadence de Dependabot (.github/dependabot.yml).
  schedule:
    - cron: "0 4 * * 1" # tous les lundis à 04:00 UTC

jobs:
  run-preprod:
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (preprod, jeu de données complet)
        env:
          # Référentiel statique suédois (apps/pipeline/ingest.py, build_se_reference) : sans elle,
          # ce step ignore juste la Suède (non bloquant), cf. le message [ingest] correspondant.
          SE_GTFS_STATIC_KEY: ${{ secrets.SE_GTFS_STATIC_KEY }}
        run: python apps/pipeline/run.py --env preprod
