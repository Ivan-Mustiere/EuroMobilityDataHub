name: Prod pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (prod, résultats définitifs)
        run: python pipeline/run.py --env prod

      - name: Tag production run
        run: |
          git tag prod-$(date +%Y-%m-%d)
          git push origin --tags
