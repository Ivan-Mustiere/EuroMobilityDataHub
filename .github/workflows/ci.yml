name: CI

on:
  pull_request:
    branches: [preprod, prod]
  push:
    branches: [preprod, prod]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest tests/ -v

      - name: Smoke test pipeline (preprod)
        run: python apps/pipeline/run.py --env preprod

      - name: Build Docker image
        run: docker build -t euromobilitydatahub:ci .
